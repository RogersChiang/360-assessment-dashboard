<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessie 360° 开放版 - 密码验证</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #4a6cf7 0%, #8e44ad 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.box {
  background: white;
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  padding: 44px 36px;
  text-align: center;
  max-width: 420px;
  width: 90%;
}
h2 { font-size: 22px; color: #2d3436; margin-bottom: 6px; }
.subtitle { font-size: 13px; color: #636e72; margin-bottom: 24px; }
input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e8ecf1;
  border-radius: 10px;
  font-size: 16px;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
  letter-spacing: 4px;
  box-sizing: border-box;
}
input:focus { border-color: #4a6cf7; }
button {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  background: #4a6cf7;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
button:hover { background: #3b5de7; }
.error { color: #e74c3c; font-size: 13px; margin-top: 12px; min-height: 18px; }
.back { display: inline-block; margin-top: 18px; color: #4a6cf7; font-size: 13px; text-decoration: none; }
.back:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="box">
  <h2>🔒 开放版访问验证</h2>
  <p class="subtitle">Jessie 360° 胜任力评估看板（实名版）</p>
  <input type="password" id="pwd" placeholder="请输入查看密码" autofocus onkeydown="if(event.key==='Enter') verify()">
  <button onclick="verify()">进入查看</button>
  <p class="error" id="err"></p>
  <a href="index.html" class="back">← 返回看板首页</a>
</div>
<script>
var PWD = "pvg360";
var TARGET = "360-dashboard-open-view.html";
function verify() {
  var v = document.getElementById("pwd").value.trim();
  if (v === PWD) {
    sessionStorage.setItem("_pvg360_pwd", PWD);
    window.location.href = TARGET;
  } else {
    document.getElementById("err").innerText = "密码错误，请重试";
    document.getElementById("pwd").value = "";
  }
}
</script>
</body>
</html>
